repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: forbid-env
        name: Forbid committing .env / auth tokens
        entry: bash -c 'git diff --cached --name-only | grep -E "^\.env(\.|$)" && echo "ERROR: .env* files are forbidden" && exit 1 || exit 0'
        language: system
        pass_filenames: false
